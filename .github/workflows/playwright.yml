name: Playwright API Automation Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      ORANGE_USERNAME: ${{ secrets.ORANGE_USERNAME }}
      ORANGE_PASSWORD: ${{ secrets.ORANGE_PASSWORD }}
      Base_URL: https://opensource-demo-orangehrmlive.com
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Test Automation Suite
        run: npx playwright test

      - name: Upload Test Execution Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-execution-report
          path: allure-report/
          retention-days: 10
